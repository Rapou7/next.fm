# Check the TCP peer before the trusted real-IP rewrite. Ranges from cloudflare.com/ips.
geo $realip_remote_addr $nextfm_edge {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

limit_req_zone $binary_remote_addr zone=nextfm_ip:2m rate=2r/s;
limit_req_zone $server_name zone=nextfm_total:64k rate=8r/s;
limit_conn_zone $binary_remote_addr zone=nextfm_conn:2m;
limit_conn_zone $server_name zone=nextfm_all_conn:64k;

server {
    listen 80;
    listen [::]:80;
    server_name nextfm.panxo.eu.org;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nextfm-acme; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nextfm.panxo.eu.org;
    ssl_certificate /etc/letsencrypt/live/nextfm.panxo.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextfm.panxo.eu.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 8s;
    client_header_timeout 8s;
    send_timeout 10s;
    keepalive_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /v1/durations {
        if ($nextfm_edge = 0) { return 403; }
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        if ($http_content_type != "application/json") { return 415; }
        limit_req zone=nextfm_ip burst=4 nodelay;
        limit_req zone=nextfm_total burst=12 nodelay;
        limit_conn nextfm_conn 3;
        limit_conn nextfm_all_conn 16;
        proxy_pass_request_headers off;
        proxy_set_header Content-Type application/json;
        proxy_set_header Host localhost;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_send_timeout 8s;
        proxy_pass http://127.0.0.1:18743;
    }
    location / { return 404; }
}
