name: Build unsigned next.fm IPA

on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: Build with diagnostics, screenshots and showcase recording tools
        type: boolean
        default: false
        required: true
      publish_release:
        description: Publish the IPA to a versioned GitHub release
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CONFIGURATION: ${{ inputs.debug_build && 'Debug' || 'Release' }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject debug release publishing
        if: inputs.debug_build && inputs.publish_release
        run: |
          echo "Debug builds are test artifacts; disable publish_release." >&2
          exit 1
      - name: Prepare release version
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r\"MARKETING_VERSION: '([0-9]+\.[0-9]+\.[0-9]+)'\", open('project.yml').read()).group(1))")
          TAG="v$VERSION"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "Tag $TAG belongs to another commit. Bump MARKETING_VERSION before a new release." >&2
              exit 1
            }
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Check selected Xcode
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test statistics, API decoding, and persistence
        run: swift test
      - name: Configure optional Last.fm API key
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python3 scripts/configure.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project NextFM.xcodeproj -scheme NextFM \
            -configuration "$CONFIGURATION" -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log
      - name: Package unsigned IPA
        run: bash scripts/package-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: next.fm-${{ inputs.debug_build && 'debug-' || '' }}unsigned-${{ github.run_number }}
          path: build/next.fm-unsigned.ipa
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
      - name: Publish IPA to GitHub Releases
        if: success() && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/next.fm-unsigned.ipa --clobber
          else
            gh release create "$RELEASE_TAG" build/next.fm-unsigned.ipa \
              --target "$GITHUB_SHA" --title "next.fm $RELEASE_TAG" --generate-notes
          fi
